name: Reclutamiento de Agente

on: push

jobs: 
  reporte-de-reclutamiento: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: El agente se presenta
        run: echo "Soy Lex Luthor, y el líder de la Legión del Mal"
        
      - name: Reporte de identidad
        run: |
          echo "Reporte de identidad"
          echo "==================="
          echo ""
          echo "Nombre clave: ${{ github.actor }}"
          echo ""
          echo "Contexto de Github"
          echo "Repo: ${{ github.repository }}"
          echo "Operación: ${{ github.sha }}"
          echo "Metadata: ${{ toJson(github) }}"

      - name: Capacidades del agente
        run: |
          echo "Capacidades del agente"
          echo "Capacidades detectivas"
          echo "Sistema Operativo"
          uname -a
          echo "Habilidades tecnicas"
          node --version
          git --version
          python3 --version
      
      - name: Reconnocimiento del terreno
        run: |
          echo "Reconnocimiento del terreno"
          ls /
          