name: Acceso a la Fortaleza Prohibida

on: push

jobs: 
  acceso-a-la-base:
    runs-on: ubuntu-latest

    steps:
      - name: El agente llega a la Fortaleza
        run: |
        echo "Accediendo a la Fortaleza de la Legión del Mal"
        
      - name: Reporte de acceso
        run: |
          echo "Reporte de acceso"
          echo "==================="
          echo ""
          echo "Nombre clave: ${{ github.actor }}"
          echo ""
          echo "Contexto de Github"
          echo "Repo: ${{ github.repository }}"
          echo "Operación: ${{ github.sha }}"
          echo "Metadata: ${{ toJson(github) }}"

      - name: Capacidades del agente
        run: |
          echo "Capacidades del agente"
